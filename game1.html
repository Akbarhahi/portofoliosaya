<!-- Chatbot Widget Include -->
<script>
const iconChatbot = document.querySelector('.iconchatbot');
iconChatbot.addEventListener('click', () => {
  const chatbotWidget = document.getElementById('chatbot-widget');
  if (chatbotWidget.style.bottom === '-100%') {
    chatbotWidget.style.bottom = '0';
  } else {
    chatbotWidget.style.bottom = '-100%';
  }
});

fetch('chatbot-widget.html')
  .then(r => r.text())
  .then(html => {
    document.body.insertAdjacentHTML('beforeend', html);
    const script = document.createElement('script');
    script.src = 'asset/js/chatbot-widget.js';
    script.onload = () => chatbotWidgetInit();
    document.body.appendChild(script);
  });
</script>
